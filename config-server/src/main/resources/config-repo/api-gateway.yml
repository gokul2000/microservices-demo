server:
  port: 8080

spring:
  cloud:
    gateway:
      # Auto-create routes from Eureka: any registered service "foo" becomes
      # reachable at /foo/**. We still define explicit routes below for clarity.
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: product-service
          uri: lb://product-service          # lb:// = load-balanced via Eureka
          predicates:
            - Path=/api/products/**
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
