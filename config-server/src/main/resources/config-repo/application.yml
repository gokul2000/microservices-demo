# Shared defaults applied to EVERY service that pulls config from this server.
# Service-specific files (product-service.yml, order-service.yml, ...) override
# and extend these values.

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    # Register by IP rather than hostname — friendlier for local/containers.
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

# A demo property resolved FROM the config server, exposed via /info to prove
# centralized config is working end to end.
info:
  app:
    description: "E-commerce microservices demo"
    config-source: "config-server (native profile)"
