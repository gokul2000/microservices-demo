server:
  port: 8761

spring:
  application:
    name: discovery-server

# A standalone Eureka server should NOT try to register with or fetch a registry
# from itself — it IS the registry. Both flags are therefore false.
eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health, info
